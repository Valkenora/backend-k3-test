<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHE System — PT Abadi Prima Intikarya</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        .navbar {
            background: #1a3a2a; color: white; padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h1 { font-size: 16px; }
        .navbar span { font-size: 13px; color: #9ecfb4; }
        .navbar button {
            background: transparent; border: 1px solid #9ecfb4;
            color: #9ecfb4; padding: 6px 12px; cursor: pointer;
            border-radius: 4px; font-size: 12px;
        }
        .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        .card {
            background: white; border-radius: 8px; padding: 24px;
            margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #1a3a2a; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 13px; margin-right: 8px;
        }
        .btn-primary { background: #1a3a2a; color: white; }
        .btn-secondary { background: #97bc62; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-warning { background: #d97706; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .alert {
            padding: 10px 16px; border-radius: 4px; margin-bottom: 16px;
            font-size: 13px;
        }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #dcfce7; color: #166534; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #ddd;
            border-radius: 4px; font-size: 13px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #1a3a2a; color: white; padding: 10px 12px; text-align: left; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        tr:hover td { background: #f9fafb; }
        .badge {
            display: inline-block; padding: 3px 8px; border-radius: 12px;
            font-size: 11px; font-weight: bold;
        }
        .badge-draft { background: #f3f4f6; color: #6b7280; }
        .badge-submitted { background: #fef3c7; color: #92400e; }
        .badge-approved { background: #dcfce7; color: #166534; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }
        .badge-endorsed { background: #dbeafe; color: #1e40af; }
        .badge-closed { background: #f3f4f6; color: #374151; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>SHE System — PT Abadi Prima Intikarya</h1>
        <div>
            <span id="nav-user"></span>
            <button onclick="logout()" style="margin-left:12px">Logout</button>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        const API = 'http://127.0.0.1:8000/api';

        function getToken() { return localStorage.getItem('token'); }
        function getUser() { return JSON.parse(localStorage.getItem('user') || '{}'); }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        function requireAuth() {
            if (!getToken()) window.location.href = '/';
        }

        async function apiFetch(endpoint, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...(options.headers || {})
            };
            const res = await fetch(`${API}${endpoint}`, { ...options, headers });
            return res;
        }

        // show logged in user in navbar
        document.addEventListener('DOMContentLoaded', () => {
            const user = getUser();
            if (user.full_name) {
                document.getElementById('nav-user').textContent =
                    `${user.full_name} (${user.role.replace('_', ' ')})`;
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
