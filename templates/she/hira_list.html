{% extends 'she/base.html' %}

{% block content %}
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center">
        <h2>HIRA Documents</h2>
        <div>
            <button class="btn btn-secondary" onclick="window.location.href='/dashboard/'">
                ← Back
            </button>
            <span id="create-btn"></span>
        </div>
    </div>
</div>

<div class="card">
    <div id="error-msg" class="alert alert-error" style="display:none"></div>
    <div id="success-msg" class="alert alert-success" style="display:none"></div>
    <table>
        <thead>
            <tr>
                <th>Document No.</th>
                <th>Work Package</th>
                <th>Work Area</th>
                <th>Status</th>
                <th>Created By</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="hira-table-body">
            <tr><td colspan="6" style="text-align:center; color:#9ca3af">Loading...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    requireAuth();
    const role = getUser().role;

    // show create button only for SHE Officer
    if (role === 'she_officer') {
        document.getElementById('create-btn').innerHTML =
            `<button class="btn btn-primary" onclick="window.location.href='/hira/create/'">
                + New HIRA
            </button>`;
    }

    function getBadge(status) {
        return `<span class="badge badge-${status}">${status}</span>`;
    }

    function getActions(hira) {
        let actions = `
            <button class="btn btn-secondary" onclick="viewHira(${hira.id})">View</button>
        `;
        if (role === 'she_officer' && hira.status === 'draft') {
            actions += `<button class="btn btn-primary" onclick="submitHira(${hira.id})">Submit</button>`;
        }
        if (role === 'she_coordinator' && hira.status === 'submitted') {
            actions += `<button class="btn btn-secondary" onclick="approveHira(${hira.id})">Approve</button>`;
            actions += `<button class="btn btn-danger" onclick="rejectHira(${hira.id})">Reject</button>`;
        }
        return actions;
    }

    async function loadHira() {
        const res = await apiFetch('/hira/documents/');
        if (res.ok) {
            const data = await res.json();
            const tbody = document.getElementById('hira-table-body');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#9ca3af">No HIRA documents found</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(h => `
                <tr>
                    <td>${h.document_number}</td>
                    <td>${h.work_package}</td>
                    <td>${h.work_area}</td>
                    <td>${getBadge(h.status)}</td>
                    <td>${h.created_by || '—'}</td>
                    <td>${getActions(h)}</td>
                </tr>
            `).join('');
        }
    }

    async function submitHira(id) {
        if (!confirm('Submit this HIRA for coordinator review?')) return;
        const res = await apiFetch(`/hira/documents/${id}/submit/`, { method: 'POST' });
        const data = await res.json();
        showMsg(res.ok, data.message || data.error);
        if (res.ok) loadHira();
    }

    async function approveHira(id) {
        if (!confirm('Approve this HIRA?')) return;
        const res = await apiFetch(`/hira/documents/${id}/approve/`, { method: 'POST' });
        const data = await res.json();
        showMsg(res.ok, data.message || data.error);
        if (res.ok) loadHira();
    }

    async function rejectHira(id) {
        const remarks = prompt('Enter rejection remarks:');
        if (remarks === null) return;
        const res = await apiFetch(`/hira/documents/${id}/reject/`, {
            method: 'POST',
            body: JSON.stringify({ remarks })
        });
        const data = await res.json();
        showMsg(res.ok, data.message || data.error);
        if (res.ok) loadHira();
    }

    async function viewHira(id) {
        const res = await apiFetch(`/hira/documents/${id}/`);
        if (!res.ok) return;
        const h = await res.json();

        let groupsHtml = '';
        if (h.groups && h.groups.length > 0) {
            h.groups.forEach(group => {
                let activitiesHtml = '';
                if (group.activities && group.activities.length > 0) {
                    activitiesHtml = group.activities.map(act => `
                        <tr>
                            <td>${act.activity_name}</td>
                            <td>${act.activity_type}</td>
                            <td>${act.initial_likelihood} × ${act.initial_severity} = <b>${act.initial_score}</b> (${act.initial_level})</td>
                            <td>${act.residual_likelihood} × ${act.residual_severity} = <b>${act.residual_score}</b> (${act.residual_level})</td>
                            <td><span class="badge ${act.residual_acceptable ? 'badge-approved' : 'badge-rejected'}">
                                ${act.residual_acceptable ? 'Yes' : 'No'}
                            </span></td>
                        </tr>
                    `).join('');
                }
                groupsHtml += `
                    <div style="margin-bottom:16px">
                        <div style="font-size:12px; font-weight:bold; color:#1a3a2a; 
                                    background:#f0fdf4; padding:8px 12px; border-radius:4px; margin-bottom:8px">
                            📍 ${group.location_function}
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Activity</th>
                                    <th>Type</th>
                                    <th>Initial Risk</th>
                                    <th>Residual Risk</th>
                                    <th>Acceptable</th>
                                </tr>
                            </thead>
                            <tbody>${activitiesHtml}</tbody>
                        </table>
                    </div>
                `;
            });
        } else {
            groupsHtml = '<p style="color:#9ca3af; font-size:13px">No activities added yet</p>';
        }

        document.getElementById('modal-content').innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px">
                <div>
                    <div style="font-size:11px; color:#6b7280">Document Number</div>
                    <div style="font-size:13px; font-weight:bold">${h.document_number}</div>
                </div>
                <div>
                    <div style="font-size:11px; color:#6b7280">Status</div>
                    <div>${getBadge(h.status)}</div>
                </div>
                <div>
                    <div style="font-size:11px; color:#6b7280">Work Package</div>
                    <div style="font-size:13px">${h.work_package}</div>
                </div>
                <div>
                    <div style="font-size:11px; color:#6b7280">Work Area</div>
                    <div style="font-size:13px">${h.work_area}</div>
                </div>
                <div>
                    <div style="font-size:11px; color:#6b7280">Created By</div>
                    <div style="font-size:13px">${h.created_by || '—'}</div>
                </div>
                <div>
                    <div style="font-size:11px; color:#6b7280">Reviewed By</div>
                    <div style="font-size:13px">${h.reviewed_by || '—'}</div>
                </div>
                ${h.remarks ? `
                <div style="grid-column:span 2">
                    <div style="font-size:11px; color:#6b7280">Remarks</div>
                    <div style="font-size:13px; color:#dc2626">${h.remarks}</div>
                </div>` : ''}
            </div>
            <h4 style="font-size:13px; color:#1a3a2a; margin-bottom:12px">Activities</h4>
            ${groupsHtml}
        `;
        // fetch audit log
        const auditRes = await apiFetch(`/audit/?entity_type=hira_document&entity_id=${id}`);
        let auditHtml = '<p style="font-size:12px; color:#9ca3af">No audit records yet</p>';
        if (auditRes.ok) {
            const logs = await auditRes.json();
            if (logs.length > 0) {
                auditHtml = logs.map(log => `
                    <div style="display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #f3f4f6; align-items:flex-start">
                        <div style="min-width:100px">
                            <span class="badge badge-${log.action}"
                                style="background:#f0fdf4; color:#166534; font-size:10px">
                                ${log.action}
                            </span>
                        </div>
                        <div style="flex:1">
                            <div style="font-size:12px; font-weight:bold">${log.performed_by}</div>
                            ${log.remarks ? `<div style="font-size:11px; color:#dc2626">${log.remarks}</div>` : ''}
                        </div>
                        <div style="font-size:11px; color:#9ca3af; white-space:nowrap">
                            ${new Date(log.timestamp).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('modal-content').innerHTML += `
            <h4 style="font-size:13px; color:#1a3a2a; margin:20px 0 8px">Audit Trail</h4>
            <div>${auditHtml}</div>
        `;
        
        document.getElementById('detail-modal').style.display = 'flex';
    }

    function showMsg(success, msg) {
        const el = document.getElementById(success ? 'success-msg' : 'error-msg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }

    loadHira();
</script>
<!-- Detail Modal -->
<div id="detail-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center">
    <div style="background:white; border-radius:8px; padding:24px; width:80%; max-width:900px;
                max-height:85vh; overflow-y:auto">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
            <h3 style="font-size:15px; color:#1a3a2a">HIRA Document Detail</h3>
            <button class="btn btn-secondary" onclick="document.getElementById('detail-modal').style.display='none'">
                Close
            </button>
        </div>
        <div id="modal-content"></div>
    </div>
</div>
{% endblock %}
