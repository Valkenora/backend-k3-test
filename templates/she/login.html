{% extends 'she/base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card">
        <h2 style="text-align:center; margin-bottom: 24px;">SHE System Login</h2>
        <div id="error-msg" class="alert alert-error" style="display:none"></div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button class="btn btn-primary" onclick="login()" style="width:100%; margin-top:8px">
            Login
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // redirect if already logged in
    if (getToken()) window.location.href = '/dashboard/';

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-msg');

        if (!email || !password) {
            errorDiv.textContent = 'Please enter email and password';
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const res = await fetch(`${API}/users/login/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard/';
            } else {
                errorDiv.textContent = data.error || 'Invalid credentials';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.textContent = 'Connection error — is the server running?';
            errorDiv.style.display = 'block';
        }
    }

    // allow Enter key to submit
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
{% endblock %}
